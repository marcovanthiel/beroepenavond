name: Security

# Wekelijkse controle plus bij elke push naar main en elke PR.
# Vervangt CodeQL: code scanning werkt op Pro alleen op publieke repo's,
# en deze repo's zijn privé.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "23 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  geheimen:
    name: Secret-scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0   # volledige historie, anders blijft een oud lek onzichtbaar
      - name: gitleaks installeren
        run: |
          curl -sSL --retry 3 \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            -o /tmp/gitleaks.tar.gz
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
      - name: Scannen
        # --redact: een treffer wordt gemeld zonder de sleutel zelf in de log te zetten.
        run: /tmp/gitleaks detect --source . --no-banner --redact --exit-code 1

  afhankelijkheden:
    name: Kwetsbare dependencies (npm audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - name: npm audit — root
        working-directory: .
        run: npm audit --audit-level=high
        continue-on-error: true
