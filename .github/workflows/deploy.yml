name: Deploy to Cloudflare Workers

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # volledige historie voor de updates-lijst
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Genereer versie-info (public/version.json + updates.json)
        run: |
          VER=$(node -p "require('./package.json').version" 2>/dev/null || echo 0.0.0)
          printf '{"version":"%s","commit":"%s","date":"%s"}' "$VER" "${GITHUB_SHA::7}" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > public/version.json
          python3 - <<'PY'
          import subprocess, json
          out = subprocess.run(['git','log','-40','--no-merges','--pretty=format:%h%x1f%cI%x1f%s'],
                               capture_output=True, text=True).stdout
          entries=[{'sha':p[0],'date':p[1],'subject':p[2]} for p in (l.split('\x1f') for l in out.splitlines()) if len(p)==3]
          json.dump({'entries':entries}, open('public/updates.json','w'), ensure_ascii=False)
          PY
          echo "version.json: $(cat public/version.json)"
      - name: Deploy met wrangler
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
